name: Tests
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - run: gofmt -l gitloom/ | tee /dev/stderr | wc -l | grep -q '^0$'
      - run: go vet ./...
      - run: go test ./...
